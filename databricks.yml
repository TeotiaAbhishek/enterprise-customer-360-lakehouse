bundle:
  name: customer_360

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: SQL warehouse that runs dbt
    default: 8bb40d527244018b
  catalog:
    description: Catalog dbt builds Silver and Gold into
    default: workspace
  alert_email:
    description: Who gets failure emails (set via BUNDLE_VAR_alert_email)

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-cdb17c9c-f080.cloud.databricks.com
    variables:
      catalog: dev

  prod:
    mode: production
    workspace:
      host: https://dbc-cdb17c9c-f080.cloud.databricks.com
      root_path: /Workspace/Users/abhishek.teotia101@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: abhishek.teotia101@gmail.com
        level: CAN_MANAGE