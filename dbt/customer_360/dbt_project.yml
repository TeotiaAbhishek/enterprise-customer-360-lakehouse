name: "customer_360"
version: "1.0.0"
config-version: 2

profile: "customer_360"

model-paths:
  - "models"

test-paths:
  - "tests"

seed-paths:
  - "seeds"

macro-paths:
  - "macros"

snapshot-paths:
  - "snapshots"

clean-targets:
  - "target"
  - "dbt_packages"

models:
  customer_360:
    staging:
      +materialized: view
      +schema: staging

    intermediate:
      +materialized: ephemeral

    silver:
      +materialized: table
      +schema: silver
    
    gold:
      +schema: gold
      +materialized: table