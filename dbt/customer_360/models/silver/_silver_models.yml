version: 2

models:
  - name: silver_customers
    description: "Validated and deduplicated customer records."

    columns:
      - name: customer_id
        description: "Unique customer identifier."
        data_tests:
          - not_null
          - unique

      - name: email
        description: "Standardised customer email."
        data_tests:
          - not_null

      - name: status
        description: "Current customer status."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - active
                  - inactive
                  - blocked
                  - pending

  - name: rejected_customers
    description: "Customer records rejected during Silver validation."

    columns:
      - name: rejection_reason
        data_tests:
          - not_null