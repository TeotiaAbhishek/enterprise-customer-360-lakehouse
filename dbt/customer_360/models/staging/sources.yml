version: 2

sources:
  - name: bronze
    database: "{{ var('bronze_catalog', 'workspace') if target.type == 'databricks' else none }}"
    schema: bronze

    tables:
      - name: customers
        description: "Raw customer records ingested into Bronze."

      - name: orders
        description: "Raw order records ingested into Bronze."

      - name: addresses
        description: "Raw address records ingested into Bronze."
      
      - name: payments
        description: "Raw payment records ingested into Bronze."
        
      - name: support_tickets
        description: "Raw support ticket records ingested into Bronze."
      
      - name: loyalty_accounts
        description: "Raw loyalty account records ingested into Bronze."