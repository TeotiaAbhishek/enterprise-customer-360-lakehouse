resources:
  jobs:
    customer_360_workflow:
      name: customer_360_workflow

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"   # 06:00 every day
        timezone_id: Australia/Sydney

      email_notifications:
        on_failure:
          - abhishek.teotia101@gmail.com

      tasks:
        - task_key: bronze_ingestion
          for_each_task:
            inputs: '["customers","addresses","orders","payments","support_tickets","loyalty_accounts"]'
            concurrency: 6
            task:
              task_key: bronze_ingestion_iteration
              notebook_task:
                notebook_path: ../databricks/bronze/bronze_ingestion.ipynb
                base_parameters:
                  dataset_name: "{{input}}"

        - task_key: dbt_customer_360
          depends_on:
            - task_key: bronze_ingestion
          environment_key: dbt
          dbt_task:
            project_directory: ../dbt/customer_360
            warehouse_id: ${var.warehouse_id}
            catalog: workspace
            schema: default
            commands:
              - dbt source freshness
              - dbt build

      environments:
        - environment_key: dbt
          spec:
            environment_version: "2"
            dependencies:
              - dbt-databricks>=1.10,<2.0